groups:
- name: Dshackle
  rules:
  - alert: JsonRpcDshackleErrorRateIsHigh
    expr: sum by (instance) (rate(dshackle_downstream_requests_total{protocol=~"http-json-rpc|ws-json-rpc", status="error"}[1m])) > 0.1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Json RPC erorr rate is high for (instance {{ $labels.instance }})"

  - alert: JsonRpcDshackleFailRateIsHigh
    expr: sum by (instance) (rate(dshackle_downstream_requests_total{protocol=~"http-json-rpc|ws-json-rpc", status="failed"}[1m])) > 0.1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Json RPC erorr rate is high for (instance {{ $labels.instance }})"


  - alert: JsonRpcDshackleRateToHigh
    expr: sum by (instance) (rate(dshackle_downstream_requests_total{protocol=~"http-json-rpc|ws-json-rpc"}[1m])) > 1000
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Json RPC rate is high for (instance {{ $labels.instance }})"


  - alert: WsRpcDshackleErrorRateIsHigh
    expr: sum by (instance, upstream) (rate(dshackle_upstream_requests_total{protocol="ws-json-rpc", status="failed"}[1m])) > 0.1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "WS RPC erorr rate is high for (instance {{ $labels.instance }})"

  - alert: UpstreamUnavailable
    expr: dshackle_upstream_availability{status!~"(ok|lagging)"} > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "One of the eth node is broken (instance {{ $labels.instance }})"

  - alert: NoEthNodesForNetwork
    expr: sum by (instance, chain) (dshackle_upstream_availability{status=~"ok|lagging"}) < 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "No nodes for network on (instance {{ $labels.instance }})"

  - alert: UpstreamIsNotSyncing
    expr: rate(dshackle_upstream_lag[5m]) < 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "ETH Node is not syncing on host (instance {{ $labels.instance }})"

